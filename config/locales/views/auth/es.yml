      sign_in: "Iniciar sesión"
      sign-in-with: "Iniciar sesión con %{provider}"
      sign-in-help: "¿No sabes qué inicio de sesión puedes usar? Busca tu escuela y haz clic en el botón de inicio de sesión:"
