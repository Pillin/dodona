  evaluations:
    show:
      view_evaluation: "Mostrar evaluación"
      evaluation: "Evaluación"
      title: "Evaluación para %{series}"
      explanation_title: "¿Cómo evaluar un envío?"
      explanation_no_grading_html: "<p>En la tabla resumen, puedes hacer clic en el botón 'Evaluar' junto a un ejercicio. Luego serás llevado a un envío incompleto de un estudiante aleatorio. Si deseas, puedes dejar retroalimentación en el código y marcar el envío como completado. Ten en cuenta que también puedes marcar un envío como completado sin dejar retroalimentación. Para comenzar, ya marcamos todos los ejercicios sin envíos como completados.</p><p>Puedes encontrar más información en <a href='https://docs.dodona.be/en/guides/teachers/grading/#het-evaluatieoverzicht'>nuestra documentación</a>.</p><p>Como recordatorio, los estudiantes <b>no</b> podrán ver la retroalimentación que has dado hasta que hagas clic en el botón 'publicar retroalimentación' a continuación.</p>"
      explanation_yes_grading_html: "<p>En la tabla resumen, puedes hacer clic en el botón 'Evaluar' junto a un ejercicio. Luego serás llevado a un envío incompleto de un estudiante aleatorio. Si deseas, puedes dejar retroalimentación en el código y asignar calificaciones usando los elementos de calificación que configuraste. Ten en cuenta que también puedes asignar calificaciones sin dejar retroalimentación. No puedes dar calificaciones a ejercicios sin envíos, estos se asignan automáticamente un 0 en el resumen de calificaciones.</p><p>Puedes encontrar información en <a href='https://docs.dodona.be/en/guides/teachers/grading/#het-evaluatieoverzicht'>nuestra documentación</a>.</p><p>Como recordatorio, los estudiantes <b>no</b> podrán ver la retroalimentación y las calificaciones hasta que hagas clic en el botón 'Publicar retroalimentación' a continuación.</p>"
      release: Publicar retroalimentación
      unrelease: Ocultar retroalimentación
      deadline_html: Esta evaluación de <b>%{users} estudiantes</b> contiene los envíos de <b>%{exercises} ejercicios</b> con <b>%{deadline}</b> como plazo.
      next_incomplete_feedback: Ir a la siguiente solución incompleta
      evaluation_progress: Progreso de evaluación
      evaluation_details: Detalles de evaluación
      evaluation_details_info_html: Esta tabla proporciona un resumen de todos los envíos en esta evaluación.<br> La barra coloreada muestra el estado del envío (sin envío, correcto o incorrecto) y el tick en el burbuja de speech si el envío ya ha sido completado.
      progress_html: "<b>%{feedback_count} de los %{feedback_total}</b> envíos tienen retroalimentación completada."
      grading_details: Resumen de calificaciones
      grading_details_info_html: Esta tabla muestra el resumen de calificaciones para la evaluación. El total por usuario es la suma de las calificaciones para los ejercicios.<br>Si no se han ingresado todas las calificaciones para un envío, la calificación se muestra en gris.
    new:
      exercises: Ejercicios
      create_evaluation: Evaluar serie
      pick_deadline: Elegir plazo
      explanation_title: "¿Qué es una evaluación?"
      explanation_html: "<p>Evaluar una serie es una forma estructurada de dar retroalimentación sobre todas las soluciones enviadas de una serie. Dodona rastrea qué envíos ya han sido revisados, por lo que puedes dividir fácilmente el trabajo entre múltiples administradores del curso. La retroalimentación que das no es inmediatamente visible para los estudiantes; puedes decidir cuándo se publica.</p><p>Puedes encontrar una guía con más información sobre evaluar ejercicios en Dodona <a href=\"https://docs.dodona.be/en/guides/teachers/grading/\">en nuestra documentación</a>.</p>"
      next: Siguiente
    add_users:
      title: Seleccionar usuarios
      explanation_title: "¿Por qué tengo que seleccionar usuarios?"
      explanation_part1: "Una evaluación consiste en ejercicios de una sola serie de ejercicios acoplados con un grupo de estudiantes. Usando los botones puedes seleccionar fácilmente todos los usuarios de este curso o solo aquellos que han enviado al menos una vez a cualquiera de los ejercicios en esta serie."
      explanation_part2: "También puedes agregar y eliminar estudiantes individuales a continuación buscando por su nombre o cualquier etiqueta. También puedes editar los usuarios de esta evaluación en un momento posterior."
      users_in_course_html:
