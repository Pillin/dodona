    support:
      support_dodona: Apoyar a Dodona
      title_l1: Aprende a programar gratis
      title_l2: para educación secundaria y superior
      submitted_solutions: Soluciones enviadas
      students: Estudiantes
      exercises: Ejercicios
      schools: Escuelas
      intro_p1_html: "Dodona es una plataforma de ejercicios en línea para <strong>aprender a programar</strong>. Busca enseñar a los estudiantes a programar de la manera más significativa y efectiva posible. Dodona actúa como un <strong>co-profesor en línea</strong>, diseñado para dar a cada estudiante acceso a educación de alta calidad. El enfoque está en las correcciones automáticas y dar retroalimentación significativa sobre las <strong>soluciones enviadas</strong> de los estudiantes."
      intro_p2_html: "Dodona es <strong>gratis para usar</strong> para las escuelas y gracias a tu apoyo, nos gustaría mantenerlo así. Mantener esta plataforma en funcionamiento lleva mucho tiempo, al igual que apoyar a cientos de escuelas y miles de estudiantes. Tu apoyo ayuda a <strong>pagar a nuestro personal</strong>. Ellos desarrollan nuevas funciones y brindan soporte a los usuarios."
      intro_p3_html: "Por favor contáctanos en <a href='mailto:dodona@ugent.be'>dodona@ugent.be</a> para obtener más información sobre este proyecto."
      how_to_support: ¿Cómo puedes apoyarnos?
      support_p0_html: "La forma más fácil de hacer una donación es usar el botón a continuación. Puedes elegir el monto tú mismo."
      support_p1_html: "Gracias al <a href='https://www.ugent.be/en/ghentuniv/university-fund' target='_blank'>Fondo Universitario</a> de la Universidad de Gante, puedes apoyarnos de una <strong>manera fiscalmente amigable</strong>. Las donaciones superiores a 40 euros vienen con un certificado fiscal, que te permite recuperar el 45% a través de tu impuesto sobre la renta personal."
      support_p2_html: "También puedes hacer un depósito a la cuenta del Fondo Universitario en <code>BE26 3900 9658 0329</code> (BIC: <code>BBRUBEBB</code>) mencionando <code>Dodona</code>."
      support_p3_html: "Si deseas hacer una donación mayor o deseas patrocinarnos (por factura), por favor contáctanos en <a href='mailto:dodona@ugent.be'>dodona@ugent.be</a> y estaremos encantados de ver las posibilidades."
      supported_by: Apoyado por
      supported_p1_html: "Dodona es dirigido por un pequeño equipo de investigadores de la <a href='https://www.ugent.be/en' target='_blank'>Universidad de Gante</a>. La plataforma es de código abierto y todo el código está disponible en <a href='https://github.com/dodona-edu/dodona' target='_blank'>GitHub</a>. El alojamiento es proporcionado por la Universidad de Gante. Además, Dodona es apoyado por proyectos de innovación educativa de la Universidad de Gante y la Facultad de Ciencias. <a href='https://www.elixir-belgium.org/' target='_blank'>ELIXIR Bélgica</a> también proporciona algo de financiación."
      support_button: Hacer una donación
    teacher_intro_card:
      title: ¡Comienza tu propio curso hoy!
      rights_request_html: "<a href='/en/rights_requests/new/'>Solicita derechos de profesor</a> para poder crear tus propios cursos."
      documentation_html: "Obtén orientación detallada sobre cómo lanzar tus propios cursos con Dodona visitando <a href='https://docs.dodona.be/en/guides/teachers/getting-started/' target='_blank'>nuestra documentación</a>."