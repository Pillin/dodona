      contact_p3_html: "Si tienes una pregunta general cuya respuesta pueda ser útil para otros, considera publicarla en <a href='https://github.com/dodona-edu/dodona/discussions' target = '_blank'>GitHub Discussions</a>. Informar sobre un error o solicitar una nueva característica también se puede hacer en GitHub."
